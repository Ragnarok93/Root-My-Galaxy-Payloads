name: HXL1 LinuxLoader direct index globals

on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - tools/y2q_hxl1_linuxloader_index_global_refs.py
      - tools/test_y2q_hxl1_linuxloader_index_global_refs.py
      - .github/workflows/hxl1-stage4-index-global-refs-ci.yml
  workflow_dispatch:

jobs:
  exact-register-window-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded HXL1 global reference scan with synthetic original bytes
        run: python3 -m unittest -q tools.test_y2q_hxl1_linuxloader_index_global_refs
