      - 'tools/test_y2q_stage3_layout_inventory.py'
      - 'tools/y2q_partial_samsung_dwarf_audit.py'
      - 'tools/test_y2q_partial_samsung_dwarf_audit.py'
      - 'tools/y2q_dwarf_type_presence.py'
      - 'tools/test_y2q_dwarf_type_presence.py'
      - 'tools/y2q_stock_bl_elf_audit.py'
      - 'tools/test_y2q_stock_bl_elf_audit.py'
      - 'tools/y2q_stock_boot_v2_audit.py'
      - 'tools/test_y2q_stock_boot_v2_audit.py'
      - 'tools/y2q_stock_dtb_inventory.py'
      - 'tools/test_y2q_stock_dtb_inventory.py'
      - 'tools/y2q_stock_fdt_semantic_audit.py'
      - 'tools/test_y2q_stock_fdt_semantic_audit.py'
      - 'tools/y2q_ghostlock_static_audit.py'
      - 'tools/test_y2q_ghostlock_static_audit.py'
      - 'tools/y2q_abl_linuxloader_extract.py'
      - 'tools/test_y2q_abl_linuxloader_extract.py'
      - 'tools/recover_y2q_hxl1_linuxloader.sh'
      - 'tools/analyze_y2q_hxl1_linuxloader_rea.sh'
      - 'tools/y2q_hxl1_cached_linuxloader.py'
      - 'tools/test_y2q_hxl1_cached_linuxloader.py'
      - 'research/y2q-G986U1UESCHXL1/qemu_lab_init.c'
      - 'research/y2q-G986U1UESCHXL1/evidence.json'
      - 'docs/SM-G986U1-G986U1UESCHXL1.md'
      - 'tools/assess_y2q_root_candidate.py'
      - 'tools/test_assess_y2q_root_candidate.py'
      - 'tools/y2q_export_table_audit.py'
      - 'tools/test_y2q_export_table_audit.py'

jobs:
  diagnostic:
    name: Test and build non-root ARM64 identity/futex probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only research tooling and source ZIP fixtures
        run: |
          python3 -m py_compile tools/verify_s20plus_firmware.py tools/inspect_samsung_source.py tools/audit_samsung_kernel_layers.py tools/assemble_samsung_stock_kernel.py tools/preflight_samsung_stock_build.py tools/configure_samsung_stock_kernel.py tools/compare_samsung_kernel_configs.py tools/build_samsung_stock_kernel.py tools/prepare_samsung_vdso_compat.py tools/summarize_samsung_kernel_build.py tools/y2q_research_toolchain.py tools/assess_y2q_root_candidate.py tools/y2q_export_table_audit.py tools/test_y2q_futex_pi_smoke.py tools/run_y2q_futex_smoke.py tools/test_run_y2q_futex_smoke.py tools/y2q_qemu_lab.py tools/test_y2q_qemu_lab.py tools/y2q_rtmutex_fix_audit.py tools/test_y2q_rtmutex_fix_audit.py tools/y2q_porting_readiness.py tools/test_y2q_porting_readiness.py tools/y2q_stage3_layout_inventory.py tools/test_y2q_stage3_layout_inventory.py tools/y2q_partial_samsung_dwarf_audit.py tools/test_y2q_partial_samsung_dwarf_audit.py tools/y2q_dwarf_type_presence.py tools/test_y2q_dwarf_type_presence.py tools/y2q_stock_bl_elf_audit.py tools/test_y2q_stock_bl_elf_audit.py tools/y2q_stock_boot_v2_audit.py tools/test_y2q_stock_boot_v2_audit.py tools/y2q_stock_dtb_inventory.py tools/test_y2q_stock_dtb_inventory.py tools/y2q_stock_fdt_semantic_audit.py tools/test_y2q_stock_fdt_semantic_audit.py tools/y2q_ghostlock_static_audit.py tools/test_y2q_ghostlock_static_audit.py tools/y2q_abl_linuxloader_extract.py tools/test_y2q_abl_linuxloader_extract.py tools/y2q_hxl1_cached_linuxloader.py tools/test_y2q_hxl1_cached_linuxloader.py
          bash -n tools/recover_y2q_hxl1_linuxloader.sh tools/analyze_y2q_hxl1_linuxloader_rea.sh
          python3 -m unittest -v tools/test_inspect_samsung_source.py tools/test_audit_samsung_kernel_layers.py tools/test_assemble_samsung_stock_kernel.py tools/test_preflight_samsung_stock_build.py tools/test_configure_samsung_stock_kernel.py tools/test_compare_samsung_kernel_configs.py tools/test_build_samsung_stock_kernel.py tools/test_prepare_samsung_vdso_compat.py tools/test_summarize_samsung_kernel_build.py tools/test_y2q_research_toolchain.py tools/test_assess_y2q_root_candidate.py tools/test_y2q_export_table_audit.py tools/test_y2q_futex_pi_smoke.py tools/test_run_y2q_futex_smoke.py tools/test_y2q_qemu_lab.py tools/test_y2q_rtmutex_fix_audit.py tools/test_y2q_porting_readiness.py tools/test_y2q_stage3_layout_inventory.py tools/test_y2q_partial_samsung_dwarf_audit.py tools/test_y2q_dwarf_type_presence.py tools/test_y2q_stock_bl_elf_audit.py tools/test_y2q_stock_boot_v2_audit.py tools/test_y2q_stock_dtb_inventory.py tools/test_y2q_stock_fdt_semantic_audit.py tools/test_y2q_ghostlock_static_audit.py tools/test_y2q_abl_linuxloader_extract.py tools/test_y2q_hxl1_cached_linuxloader.py
      - name: Install or find Android NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          if [[ ! -x "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" ]]; then
            yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;30.0.16248370" || true
          fi
          if [[ ! -x "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" ]]; then
            echo "NDK r30 not installed by sdkmanager" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build Android 13 ARM64 non-root probe
        run: bash research/y2q-G986U1UESCHXL1/build_probe.sh
      - name: Build safe HXL1 ARM64 futex-PI smoke test (uncontended only)
        shell: bash
        run: |
          set -euo pipefail
          bash research/y2q-G986U1UESCHXL1/build_futex_pi_smoke.sh
          readelf -h research/y2q-G986U1UESCHXL1/build/y2q-HXL1-futex-pi-smoke | grep -E 'DYN|AArch64'
          test -f research/y2q-G986U1UESCHXL1/build/y2q-HXL1-futex-pi-smoke
          echo 'Safe user-space futex syscall smoke test; NOT a CVE trigger or root payload'
      - name: Build inert Android HXL1 ELF64 shared diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/y2q-G986U1UESCHXL1/build
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" \
            -std=c11 -O2 -g0 -fPIC -shared -fvisibility=hidden \
            -fstack-protector-strong -Wall -Wextra -Werror -Wl,--no-undefined \
            research/y2q-G986U1UESCHXL1/diagnostic_payload.c \
            -o research/y2q-G986U1UESCHXL1/build/y2q-HXL1-identity-diagnostic.so
          python3 -c 'import sys; sys.path.insert(0,"tools"); from y2q_research_toolchain import verify_elf_shared_aarch64; from pathlib import Path; verify_elf_shared_aarch64(Path("research/y2q-G986U1UESCHXL1/build/y2q-HXL1-identity-diagnostic.so"))'
          readelf -h research/y2q-G986U1UESCHXL1/build/y2q-HXL1-identity-diagnostic.so | grep -E 'DYN|AArch64'
          echo 'READ-ONLY ARM64 ELF verified; not an exploit or root payload'
      - name: Upload inert HXL1 diagnostic shared library
        uses: actions/upload-artifact@v4
        with:
          name: y2q-HXL1-readonly-library-NOT-ROOT
          path: research/y2q-G986U1UESCHXL1/build/y2q-HXL1-identity-diagnostic.so
          if-no-files-found: error
      - name: Upload read-only diagnostic (not an exploit)
        uses: actions/upload-artifact@v4
        with:
          name: y2q-identity-probe-NOT-ROOT
          path: research/y2q-G986U1UESCHXL1/build/y2q-identity-probe
          if-no-files-found: error

      - name: Upload safe futex-PI ARM64 smoke test (NOT ROOT)
        uses: actions/upload-artifact@v4
        with:
          name: y2q-HXL1-futex-pi-smoke-NOT-ROOT
          path: research/y2q-G986U1UESCHXL1/build/y2q-HXL1-futex-pi-smoke
          if-no-files-found: error
