      - 'tools/test_summarize_samsung_kernel_build.py'
      - 'tools/y2q_research_toolchain.py'
      - 'tools/test_y2q_research_toolchain.py'
      - 'research/y2q-G986U1UESCHXL1/diagnostic_payload.c'
      - 'research/y2q-G986U1UESCHXL1/futex_pi_smoke.c'
      - 'research/y2q-G986U1UESCHXL1/build_futex_pi_smoke.sh'
      - 'tools/test_y2q_futex_pi_smoke.py'
      - 'tools/run_y2q_futex_smoke.py'
      - 'tools/test_run_y2q_futex_smoke.py'
