name: Galaxy S20+ read-only ARM64 probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - '.github/workflows/y2q-identity-probe.yml'
      - 'research/y2q-G986U1UESCHXL1/identity_probe.c'
      - 'research/y2q-G986U1UESCHXL1/build_probe.sh'
      - 'tools/verify_s20plus_firmware.py'
      - 'tools/inspect_samsung_source.py'
      - 'tools/test_inspect_samsung_source.py'
      - 'tools/audit_samsung_kernel_layers.py'
      - 'tools/test_audit_samsung_kernel_layers.py'
      - 'tools/assemble_samsung_stock_kernel.py'
      - 'tools/test_assemble_samsung_stock_kernel.py'
      - 'tools/preflight_samsung_stock_build.py'
      - 'tools/test_preflight_samsung_stock_build.py'
      - 'tools/configure_samsung_stock_kernel.py'
      - 'tools/test_configure_samsung_stock_kernel.py'
      - 'tools/compare_samsung_kernel_configs.py'
      - 'tools/test_compare_samsung_kernel_configs.py'
      - 'tools/build_samsung_stock_kernel.py'
      - 'tools/test_build_samsung_stock_kernel.py'
      - 'tools/prepare_samsung_vdso_compat.py'
      - 'tools/test_prepare_samsung_vdso_compat.py'
      - 'tools/summarize_samsung_kernel_build.py'
      - 'tools/test_summarize_samsung_kernel_build.py'
      - 'tools/assess_y2q_root_candidate.py'
      - 'tools/test_assess_y2q_root_candidate.py'

jobs:
  diagnostic:
    name: Build non-root ARM64 identity probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only research tooling and source ZIP fixtures
        run: |
          python3 -m py_compile tools/verify_s20plus_firmware.py tools/inspect_samsung_source.py tools/audit_samsung_kernel_layers.py tools/assemble_samsung_stock_kernel.py tools/preflight_samsung_stock_build.py tools/configure_samsung_stock_kernel.py tools/compare_samsung_kernel_configs.py tools/build_samsung_stock_kernel.py tools/prepare_samsung_vdso_compat.py tools/summarize_samsung_kernel_build.py tools/assess_y2q_root_candidate.py
          python3 -m unittest -v tools/test_inspect_samsung_source.py tools/test_audit_samsung_kernel_layers.py tools/test_assemble_samsung_stock_kernel.py tools/test_preflight_samsung_stock_build.py tools/test_configure_samsung_stock_kernel.py tools/test_compare_samsung_kernel_configs.py tools/test_build_samsung_stock_kernel.py tools/test_prepare_samsung_vdso_compat.py tools/test_summarize_samsung_kernel_build.py tools/test_assess_y2q_root_candidate.py
      - name: Install or find Android NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          if [[ ! -x "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" ]]; then
            yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;30.0.16248370" || true
          fi
          if [[ ! -x "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" ]]; then
            echo "NDK r30 not installed by sdkmanager" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build Android 13 ARM64 non-root probe
        run: bash research/y2q-G986U1UESCHXL1/build_probe.sh
      - name: Upload read-only diagnostic (not an exploit)
        uses: actions/upload-artifact@v4
        with:
          name: y2q-identity-probe-NOT-ROOT
          path: research/y2q-G986U1UESCHXL1/build/y2q-identity-probe
          if-no-files-found: error
