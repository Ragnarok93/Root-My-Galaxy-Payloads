name: HXL1 Stage 7 kernel module admission evidence

on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - tools/assess_y2q_root_candidate.py
      - tools/test_assess_y2q_root_candidate.py
      - .github/workflows/hxl1-stage7-module-admission-ci.yml
  workflow_dispatch:

jobs:
  research-only-candidate-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HXL1 candidate and module admission tests only
        run: python3 -m unittest -q tools.test_assess_y2q_root_candidate
