name: HXL1 Runtime DTB Identity Read-Only CI
on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - tools/y2q_hxl1_runtime_dtb_identity.py
      - tools/test_y2q_hxl1_runtime_dtb_identity.py
      - tools/y2q_hxl1_linuxloader_cached_index_audit.py
      - tools/test_y2q_hxl1_linuxloader_cached_index_audit.py
      - tools/y2q_hxl1_linuxloader_getter_callsites.py
      - tools/test_y2q_hxl1_linuxloader_getter_callsites.py
      - tools/run_y2q_hxl1_linuxloader_getter_functions.sh
      - research/y2q-G986U1UESCHXL1/evidence.json
      - .github/workflows/hxl1-stage4-runtime-dtb-identity-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-identity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and no-phone FDT candidate tests
        run: |
          python3 -m py_compile tools/y2q_hxl1_runtime_dtb_identity.py tools/test_y2q_hxl1_runtime_dtb_identity.py
          python3 -m unittest -v tools.test_y2q_hxl1_runtime_dtb_identity
      - name: Bounded cached LinuxLoader analysis tests (no REA provider)
        run: |
          python3 -m py_compile tools/y2q_hxl1_linuxloader_cached_index_audit.py tools/test_y2q_hxl1_linuxloader_cached_index_audit.py
          python3 -m unittest -v tools.test_y2q_hxl1_linuxloader_cached_index_audit
      - name: Offline authenticated getter-callsite and bounded-runner syntax
        run: |
          python3 -m py_compile tools/y2q_hxl1_linuxloader_getter_callsites.py tools/test_y2q_hxl1_linuxloader_getter_callsites.py
          python3 -m unittest -v tools.test_y2q_hxl1_linuxloader_getter_callsites
          bash -n tools/run_y2q_hxl1_linuxloader_getter_functions.sh
