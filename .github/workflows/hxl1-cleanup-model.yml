  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-user-space-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 user-mode test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Compile and test harmless user-space C ownership model
        run: python3 -m unittest -v tools.test_y2q_hxl1_cleanup_regression tools.test_y2q_hxl1_original_cleanup_slice tools.test_y2q_hxl1_qemu_earlyboot_triage tools.test_y2q_hxl1_qemu_trace_attest tools.test_y2q_hxl1_qemu_exception_summary tools.test_y2q_hxl1_qemu_fault_sites tools.test_y2q_hxl1_qemu_secure_monitor_gate tools.test_y2q_hxl1_qemu_smc_register_capture tools.test_y2q_hxl1_rkp_bitmap_abi_audit tools.test_y2q_hxl1_rkp_bitmap_preflight tools.test_y2q_hxl1_rkp_pool_model tools.test_y2q_hxl1_rkp_guest_stage tools.test_y2q_hxl1_rkp_guest_commit tools.test_y2q_hxl1_qemu_virt_dtb_inventory tools.test_y2q_hxl1_qemu_boot_memory_audit tools.test_y2q_hxl1_qemu_entry_fdt_audit tools.test_y2q_hxl1_qemu_runtime_fdt_compare tools.test_y2q_hxl1_qemu_fdt_canary tools.test_y2q_hxl1_memblock_trace_gate tools.test_y2q_hxl1_qemu_memblock_pc_sampler tools.test_y2q_hxl1_qemu_pc_attribution tools.test_y2q_hxl1_setup_arch_loop_audit tools.test_y2q_hxl1_qemu_fdt_size_recovery tools.test_y2q_hxl1_qemu_compact_fdt_capture tools.test_y2q_hxl1_compact_exception_audit tools.test_y2q_hxl1_compact_fault_dependencies tools.test_y2q_hxl1_qemu_compact_smc_registers tools.test_y2q_hxl1_compact_bitmap_call_audit tools.test_y2q_hxl1_qemu_compact_fault_regs tools.test_y2q_hxl1_compact_fault_live_attribution tools.test_y2q_hxl1_compact_fault_function_windows tools.test_y2q_hxl1_qemu_compact_register_provenance tools.test_y2q_hxl1_compact_regorigin_route_audit tools.test_y2q_hxl1_porting_automation tools.test_y2q_hxl1_clang10_checkpoint tools.test_y2q_hxl1_stage3_offset_verification tools.test_y2q_hxl1_stage3_member_flow tools.test_y2q_research_toolchain tools.test_y2q_hxl1_porting_bundle_repair
      - name: Validate complete HXL1 porting plan without private owner artifacts
        run: python3 tools/y2q_hxl1_porting_automation.py --mode plan
      - name: Evidence scope
        run: |
          echo "Model-only assertions passed. This CI job does not check Samsung source SHA pins."
          echo "No Samsung kernel was executed, no CVE was triggered, and root/KernelSU remain unverified."
