name: HXL1 GhostLock Stack Audit Prerequisites
on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - .github/workflows/hxl1-ghostlock-stack-gate-ci.yml
      - tools/y2q_hxl1_ghostlock_stack_gate.py
      - tools/test_y2q_hxl1_ghostlock_stack_gate.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-stack-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline extractor syntax
        run: |
          python -m py_compile \
            tools/y2q_hxl1_ghostlock_stack_gate.py \
            tools/test_y2q_hxl1_ghostlock_stack_gate.py
      - name: Run synthetic original-image boundary tests
        run: python -m unittest -v tools.test_y2q_hxl1_ghostlock_stack_gate
