name: HXL1 GhostLock Stack Audit Prerequisites
on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - .github/workflows/hxl1-ghostlock-stack-gate-ci.yml
      - tools/y2q_hxl1_ghostlock_stack_gate.py
      - tools/test_y2q_hxl1_ghostlock_stack_gate.py
      - tools/y2q_hxl1_dispatch_archive_audit.py
      - tools/test_y2q_hxl1_dispatch_archive_audit.py
      - tools/y2q_hxl1_frame_footprint_audit.py
      - tools/test_y2q_hxl1_frame_footprint_audit.py
      - tools/y2q_hxl1_static_cfg_audit.py
      - tools/test_y2q_hxl1_static_cfg_audit.py
      - tools/y2q_hxl1_lifetime_contract_audit.py
      - tools/test_y2q_hxl1_lifetime_contract_audit.py
      - tools/y2q_hxl1_select_header_provenance.py
      - tools/test_y2q_hxl1_select_header_provenance.py
      - tools/y2q_hxl1_factory_debug_ceiling.py
      - tools/test_y2q_hxl1_factory_debug_ceiling.py
      - tools/y2q_hxl1_oem_debug_discovery.py
      - tools/test_y2q_hxl1_oem_debug_discovery.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-stack-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline extractor syntax
        run: |
          python -m py_compile \
            tools/y2q_hxl1_ghostlock_stack_gate.py \
            tools/test_y2q_hxl1_ghostlock_stack_gate.py \
            tools/y2q_hxl1_dispatch_archive_audit.py \
            tools/test_y2q_hxl1_dispatch_archive_audit.py \
            tools/y2q_hxl1_frame_footprint_audit.py \
            tools/test_y2q_hxl1_frame_footprint_audit.py \
            tools/y2q_hxl1_static_cfg_audit.py \
            tools/test_y2q_hxl1_static_cfg_audit.py \
            tools/y2q_hxl1_lifetime_contract_audit.py \
            tools/test_y2q_hxl1_lifetime_contract_audit.py \
            tools/y2q_hxl1_select_header_provenance.py \
            tools/test_y2q_hxl1_select_header_provenance.py \
            tools/y2q_hxl1_factory_debug_ceiling.py \
            tools/test_y2q_hxl1_factory_debug_ceiling.py \
            tools/y2q_hxl1_oem_debug_discovery.py \
            tools/test_y2q_hxl1_oem_debug_discovery.py
      - name: Run synthetic original-image and dispatch evidence tests
        run: |
          python -m unittest -v \
            tools.test_y2q_hxl1_ghostlock_stack_gate \
            tools.test_y2q_hxl1_dispatch_archive_audit \
            tools.test_y2q_hxl1_frame_footprint_audit \
            tools.test_y2q_hxl1_static_cfg_audit \
            tools.test_y2q_hxl1_lifetime_contract_audit \
            tools.test_y2q_hxl1_select_header_provenance \
            tools.test_y2q_hxl1_factory_debug_ceiling \
            tools.test_y2q_hxl1_oem_debug_discovery
