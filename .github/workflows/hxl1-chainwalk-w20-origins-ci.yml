name: HXL1 chainwalk W20 origins
on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - tools/y2q_hxl1_chainwalk_w20_origins.py
      - tools/test_y2q_hxl1_chainwalk_w20_origins.py
      - .github/workflows/hxl1-chainwalk-w20-origins-ci.yml
  workflow_dispatch:

jobs:
  synthetic-carrier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: New W20 carrier tests only
        run: python3 -m unittest -q tools.test_y2q_hxl1_chainwalk_w20_origins
