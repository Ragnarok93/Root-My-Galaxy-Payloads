name: HXL1 cross-task lifetime model
on:
  push:
    branches:
      - feature/s20plus-investigation-shizuku-20261009
    paths:
      - tools/y2q_hxl1_pi_lifetime_state_model.py
      - tools/test_y2q_hxl1_pi_lifetime_state_model.py
      - .github/workflows/hxl1-pi-lifetime-model-ci.yml
  workflow_dispatch:

jobs:
  abstract-invariant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nine new two-task source invariants only
        run: python3 -m unittest -q tools.test_y2q_hxl1_pi_lifetime_state_model
